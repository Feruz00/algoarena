# Infrastructure only (RabbitMQ, Kafka, Redis). Same file on Windows and Ubuntu.
# The judge worker itself runs on the host (npm start / systemd) because it needs
# the Docker socket (dev) or isolate + cgroups (production).
services:
  rabbitmq:
    image: rabbitmq:3-management
    ports: ["5672:5672", "15672:15672"]
    volumes: [rabbitmq-data:/var/lib/rabbitmq]
    restart: unless-stopped

  kafka:
    image: apache/kafka:3.8.0
    ports: ["9092:9092"]
    restart: unless-stopped

  redis:
    image: redis:7
    ports: ["6379:6379"]
    restart: unless-stopped

volumes:
  rabbitmq-data:
